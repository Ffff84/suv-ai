# push в main -> тесты -> SSH на VPS -> git reset --hard -> restart службы.
# Спит, пока в Settings -> Secrets -> Actions не заданы VPS_HOST,
# VPS_USER, VPS_SSH_KEY (инструкция: ДЕПЛОЙ.md, раздел 4).
name: Deploy to VPS

on:
  push:
    branches: [main]

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest -q

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        env:
          HOST: ${{ secrets.VPS_HOST }}
          SSH_USER: ${{ secrets.VPS_USER }}
          KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          if [ -z "$HOST" ] || [ -z "$KEY" ]; then
            echo "VPS secrets not set - skipping deploy (see ДЕПЛОЙ.md)"
            exit 0
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          # Три проверки по очереди. Без них падение выглядит как
          # безымянная ошибка ssh, и непонятно, что чинить: ключ, адрес
          # сервера или сам сервер. Значения секретов GitHub скрывает
          # в логах звёздочками, поэтому их тут и не печатаем.
          if ! ssh-keygen -y -f ~/.ssh/deploy_key >/dev/null 2>&1; then
            echo "::error::VPS_SSH_KEY не читается как приватный ключ."
            echo "Обычно это значит: вставлен deploy_key.pub вместо deploy_key,"
            echo "или ключ скопирован не целиком — нужны и строка BEGIN, и END."
            exit 1
          fi
          echo "1/3 ключ: формат в порядке"

          if ! timeout 15 bash -c "cat < /dev/null > /dev/tcp/$HOST/22" 2>/dev/null; then
            echo "::error::Сервер не отвечает на порту 22."
            echo "Проверьте VPS_HOST: это должен быть IP или домен —"
            echo "без http://, без порта, без пробелов. И что сервер включён."
            exit 1
          fi
          echo "2/3 сеть: порт 22 отвечает"

          ssh-keyscan -T 10 -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

          # Вход проверяем отдельно от деплоя: иначе «не пустил ключ» и
          # «на сервере нет кода» дают одну и ту же безымянную ошибку.
          # Текст ssh печатаем как есть — GitHub сам скрывает значения
          # секретов звёздочками, адрес сервера в лог не утечёт.
          AUTH=$(ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o ConnectTimeout=15 \
                 "${SSH_USER:-root}@$HOST" 'echo AUTH_OK' 2>&1) || true
          if ! echo "$AUTH" | grep -q AUTH_OK; then
            echo "--- что ответил ssh ---"
            echo "$AUTH"
            echo "-----------------------"
            echo "::error::Сервер не пустил по ключу."
            echo "Permission denied (publickey) — публичный ключ deploy_key.pub"
            echo "  не добавлен в ~/.ssh/authorized_keys на сервере (ДЕПЛОЙ.md, шаг B)."
            echo "Или VPS_USER не тот пользователь, под которым заведён ключ."
            exit 1
          fi
          echo "3/4 вход по ключу: работает"

          # Вывод с сервера печатаем целиком и всегда: без него падение
          # внутри удалённого скрипта выглядит просто как «exit 1».
          FAILED=""
          OUT=$(ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o ConnectTimeout=15 \
                "${SSH_USER:-root}@$HOST" '
            set -e
            test -d /root/suv-ai || { echo "НЕТ ПАПКИ /root/suv-ai"; exit 10; }
            cd /root/suv-ai
            git fetch origin main
            git reset --hard origin/main
            pip install -r requirements.txt --break-system-packages -q
            # Анкета поля живёт и в fields/*.json, и в базе. Деплой везёт
            # только код: правка конфига в базу не попадает, пока руками
            # не запустят seed_field.py. Так уже уезжала площадь
            # виноградника, и бот полгода считал бы вдвое больше воды.
            # Здесь мы её ПОКАЗЫВАЕМ и ничего не пересеваем: пересев
            # затирал бы правки, сделанные со стороны базы, и деплой стал
            # бы новым способом потерять данные. Решение — за человеком.
            python3 scripts/check_fields.py || echo "ПОЛЯ РАСХОДЯТСЯ С КОНФИГОМ"
            # Страницу обводки поля отдаёт nginx из /var/www — из /root
            # он её не прочитает. Копируем на каждом деплое: иначе
            # фермер будет рисовать по версии, которая устарела на месяц.
            if [ -d /var/www/suv-ai ]; then
              cp miniapp/draw.html /var/www/suv-ai/draw.html
              echo "Mini App обновлён"
              # Лендинг живёт в репозитории с этого дня; старая версия
              # сохранена на сервере как index-old-20260816.html
              if [ -f landing/index.html ]; then
                cp landing/index.html /var/www/suv-ai/index.html
                mkdir -p /var/www/suv-ai/img
                cp -r landing/img/. /var/www/suv-ai/img/ 2>/dev/null || true
                if [ -d landing/video ]; then
                  mkdir -p /var/www/suv-ai/video
                  cp -r landing/video/. /var/www/suv-ai/video/ 2>/dev/null || true
                fi
                if [ -d landing/docs ]; then
                  mkdir -p /var/www/suv-ai/docs
                  cp -r landing/docs/. /var/www/suv-ai/docs/ 2>/dev/null || true
                fi
                # Шрифты со своего домена: index.html ссылается на
                # fonts/*.woff2 — без этого блока новая папка не доезжает
                # и прод молча падает на системные шрифты.
                if [ -d landing/fonts ]; then
                  mkdir -p /var/www/suv-ai/fonts
                  cp -r landing/fonts/. /var/www/suv-ai/fonts/ 2>/dev/null || true
                fi
                if [ -d landing/blog ]; then
                  mkdir -p /var/www/suv-ai/blog
                  cp -r landing/blog/. /var/www/suv-ai/blog/ 2>/dev/null || true
                fi
                # Кабинет фермера: статика отдаётся nginx, данные —
                # службой suv-web через /api/ (см. ниже).
                if [ -d landing/dala ]; then
                  mkdir -p /var/www/suv-ai/dala
                  cp -r landing/dala/. /var/www/suv-ai/dala/ 2>/dev/null || true
                fi
                # SEO-файлы в корне: robots, sitemap, favicon, og-картинка
                for f in robots.txt sitemap.xml favicon.svg og.jpg; do
                  [ -f "landing/$f" ] && cp "landing/$f" "/var/www/suv-ai/$f"
                done
                # Файлы подтверждения прав поисковиков: имя выдаёт сам
                # сервис, поэтому копируем по маске — иначе очередной
                # деплой снимет подтверждение вместе с файлом.
                for f in landing/yandex_*.html landing/google*.html; do
                  [ -f "$f" ] && cp "$f" /var/www/suv-ai/
                done
                echo "Лендинг обновлён"
              fi
            fi
            systemctl list-unit-files suv-ai.service >/dev/null 2>&1 \
              || { echo "НЕТ СЛУЖБЫ suv-ai.service"; exit 11; }
            systemctl restart suv-ai
            # Кабинет — отдельная служба: падение API не должно ронять
            # бота, поэтому и перезапускается он своей строкой. Если
            # юнит ещё не установлен (первый деплой ветки), молчим.
            if systemctl list-unit-files suv-web.service >/dev/null 2>&1 \
               && systemctl is-enabled suv-web >/dev/null 2>&1; then
              systemctl restart suv-web
              sleep 2
              curl -fsS http://127.0.0.1:8081/api/health >/dev/null \
                && echo "кабинет: API отвечает" \
                || echo "ВНИМАНИЕ: кабинет не отвечает на /api/health"
            else
              echo "кабинет: служба suv-web не установлена — пропускаю"
            fi
            sleep 3
            systemctl is-active suv-ai
          ' 2>&1) || FAILED=1
          echo "--- ответ сервера ---"
          echo "$OUT"
          echo "---------------------"
          # Предупреждение, а не ошибка: расхождение анкеты — не повод
          # не пускать на сервер исправление кода. Но и потеряться в
          # логе оно не должно, поэтому ::warning:: видно прямо в списке
          # запусков Actions.
          if echo "$OUT" | grep -q "ПОЛЯ РАСХОДЯТСЯ С КОНФИГОМ"; then
            echo "::warning::Анкета поля в базе не сходится с fields/*.json."
            echo "Что именно разошлось — в ответе сервера выше. База НЕ тронута:"
            echo "решите, кто прав, и пересейте руками (ДЕПЛОЙ.md, раздел 4)."
          fi
          if [ -n "$FAILED" ]; then
            if echo "$OUT" | grep -q "НЕТ ПАПКИ"; then
              echo "::error::На сервере нет /root/suv-ai — код не клонирован."
              echo "Выполните первичную настройку: ДЕПЛОЙ.md, раздел 3."
            elif echo "$OUT" | grep -q "НЕТ СЛУЖБЫ"; then
              echo "::error::Код на месте, но служба suv-ai не создана."
              echo "Создайте юнит systemd: ДЕПЛОЙ.md, раздел 3, блок с systemctl."
            else
              echo "::error::Деплой на сервере не отработал, текст ошибки выше."
            fi
            exit 1
          fi
          echo "4/4 деплой: бот перезапущен"
